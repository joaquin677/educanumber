<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Juegos</title>
    <link rel="icon" href="img/icono.png" type="image/png">
    <link rel="stylesheet" href="css/estilo_inicio.css">
</head>

<body>
    <div class="container">
        <img src="img/logo principal.png" alt="Logo juego" class="logo">
        <h2>¡Bienvenido al desafío!</h2>
        <p class="subtitulo">Ingresa tu nombre y elige un avatar para comenzar.</p>

        <input id="nombre" type="text" placeholder="Tu nombre">

        <div class="avatars">
            <img src="img/avatar1.png" alt="Avatar 1" onclick="seleccionar(this)">
            <img src="img/avatar2.png" alt="Avatar 2" onclick="seleccionar(this)">
            <img src="img/avatar3.png" alt="Avatar 3" onclick="seleccionar(this)">
        </div>

        <button id="btn" onclick="ingresar()">Comenzar aventura</button>
        <button type="button" onclick="window.location.href='todos.html'">ver todos los juegos</button>
        <div id="feedback" class="mensaje-voz"></div>
    </div>

    <script src="js/index.js"></script>
</body>

</html>
