<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puntuaciones Celebración</title>
    <link rel="stylesheet" href="css/puntuacion.css">
</head>
<body>
    <div class="page-bg"></div>
    <main class="panel">
        <header class="hero">
            <div class="hero-icon">🎓</div>
            <div>
                <h1>Tabla de Puntuaciones</h1>
                <p>¡Celebremos cada logro del juego con una tabla muy divertida!</p>
            </div>
        </header>


        <section class="score-card">
            <div class="score-header">
                <div>
                    <h2>Top puntajes</h2>
                    <p>Niños de 4° básico, jugando con números y celebrando al final.</p>
                </div>
                <div class="badge">FINAL DEL JUEGO</div>
            </div>


            <table class="score-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Jugador</th>
                        <th>Puntos</th>
                        <th>Tiempo</th>
                        <th>Bonus</th>
                    </tr>
                </thead>
                <tbody id="scoreBody"></tbody>
            </table>
        </section>


        <section class="celebracion">
            <div class="fiesta">🎉</div>
            <div class="fiesta">✨</div>
            <div class="fiesta">🎊</div>
        </section>
    </main>


    <div class="math-drops">
        <span>+</span>
        <span>×</span>
        <span>√</span>
        <span>π</span>
        <span>≈</span>
        <span>15k</span>
        <span>9</span>
    </div>


    <script src="js/puntuacion.js"></script>
</body>
</html>
